# ============================================================================
# Docker Compose – Secret Management
# ============================================================================

name: "${PROJECT_NAME?check example.env}"

x-vault-ro: &vault-ro
  source: "vault_data"
  read_only: true

x-type-script: &type-inject
    <<: *vault-ro
    target: "/inject"
    volume:
      nocopy: true
      subpath: "share/trust/me/bro"

x-type-ca-root: &type-ca-root
    <<: *vault-ro
    target: "/usr/local/share/ca-certificates"
    volume:
      nocopy: true
      subpath: "share/ca_root"

x-type-ca-cert: &type-ca-cert
    <<: *vault-ro
    target: "/certs"
    volume:
      nocopy: true
      subpath: "share/ca_root"

x-health: &health
  start_period:   "${GRACE_PERIOD}m"
  start_interval: "${GRACE_PERIOD}0s"
  interval:       "${GRACE_PERIOD}m"
  timeout:        "${GRACE_PERIOD}0s"
  retries:        "${GRACE_PERIOD}0"

x-depends-on-vault: &depends-on-vault
  depends_on:
    vault_srvc:
      condition: "service_healthy"

x-ai-srvc:  &ai-srvc
    build: "./AI_srvc"
    <<: *depends-on-vault 
    volumes:
      - "ai_models:/app/models:ro"
      - "ai_logs:/app/logs"
      - type: "volume"
        <<: *type-inject
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/ai_srvc"
    networks: [ "ai_net" ]
    restart: "unless-stopped"

x-vanity: &vanity
    profiles:  [ "hidden_service" ]
    image: "ghcr.io/cathugger/mkp224o:master"
    volumes:  [ "tor_data:/keys" ]
    network_mode: "none"
    deploy:
      mode: "global-job"

x-net: &net
  driver: "bridge"
  attachable: false
  enable_ipv6: false


services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    build: "./postgres_db"
    container_name: "postgres_${DATABASE_NAMESPACE}"
    hostname: "postgres.${PROJECT_NAME}-${DATABASE_NAMESPACE}"
    expose: [ "${POSTGRES_PORT}" ]
    <<: *depends-on-vault 
    volumes:
      - "postgres_data:${POSTGRES_DATA_DIR}"
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/postgres_db"
    networks:
      service_net:
        ipv4_address: "10.133.7.24"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT}"]
      <<: *health
    restart: "unless-stopped"

  # ── MongoDB ─────────────────────────────────────────────────────
  mongo:
    build: "./mongo_db"
    container_name: "mongo_${DATABASE_NAMESPACE}"
    hostname: "mongo.${PROJECT_NAME}-${DATABASE_NAMESPACE}"
    expose: [ "${MONGO_PORT}" ]
    <<: *depends-on-vault 
    volumes:
      - "mongo_data:/data/db"
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/mongo_db"
    networks:
      service_net:
        ipv4_address: "10.133.7.23"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      <<: *health
    restart: "unless-stopped"

  # ── Auth Service ────────────────────────────────────────────────
  auth_srvc:
    build: "./auth_srvc"
    container_name: "auth_service"
    hostname: "auth.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    expose: [ "${AUTH_PORT}" ]
    depends_on:
      postgres:
        condition: "service_healthy"
    volumes:
      - "avatar_uploads:/app/uploads/avatars"
      - type: "volume"
        <<: *type-inject
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/auth_srvc"
    networks:
      service_net:
        ipv4_address: "10.133.7.22"
    restart: "unless-stopped"

  # ── Chat Service ────────────────────────────────────────────────
  chat_srvc:
    build: "./chat_srvc"
    container_name: "chat_service"
    hostname: "chat.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    expose: [ "${CHAT_PORT}" ]
    depends_on: [ "mongo" ]
    volumes:
      - type: "volume"
        <<: *type-inject
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/chat_srvc"
    networks:
      service_net:
        ipv4_address: "10.133.7.21"
    restart: "unless-stopped"

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:  "./frontend"
    container_name: "frontend_service"
    hostname: "frontend.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    expose: [ "${FRONTEND_PORT}" ]
    depends_on: [ "auth_srvc", "chat_srvc" ]
    volumes:
      - type: "volume"
        <<: *type-inject
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/frontend"
    networks:
      service_net:
        ipv4_address: "10.133.7.20"
    restart: "unless-stopped"

  # ── Game Service ────────────────────────────────────────────────
  game_srvc:
    build: "./game_srvc"
    container_name: "game_service"
    hostname: "game.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    expose: [ "${GAME_PORT}", "${GAME_WS_PORT}" ]
    depends_on:
      postgres:
        condition: "service_healthy"
    volumes:
      - type: "volume"
        <<: *type-inject
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/game_srvc"
    networks:
      service_net:
        ipv4_address: "10.133.7.19"
      ai_net:
    restart: "unless-stopped"

  # ── AI Service (DQN Player Bots) ────────────────────────────────
#  ai_srvc:
#    container_name: "ai_service"
#    hostname: "ai-1.${PROJECT_NAME}-${AI_NAMESPACE}"
#    <<: *ai-srvc
#
#  ai_srvc_slot2:
#    hostname: "ai-2.${PROJECT_NAME}-${AI_NAMESPACE}"
#    container_name: "ai_service_slot2"
#    <<: *ai-srvc
#
#  ai_srvc_slot3:
#    hostname: "ai-3.${PROJECT_NAME}-${AI_NAMESPACE}"
#    container_name: "ai_service_slot3"
#    <<: *ai-srvc

  # ── Tor ─────────────────────────────────────────────────────────
  tor:
    profiles: [ "hidden_service" ]
    build: "./tor_proxy"
    container_name: "${TOR_CODENAME}_${REV_PROXY_NAMESPACE}"
    hostname: "${TOR_CODENAME}.${PROJECT_NAME}-${REV_PROXY_NAMESPACE}"
    ports:  [ "${HIDDEN_SERVICE_PORT}:9050" ]
    <<: *depends-on-vault
    volumes:  [ "tor_data:/var/lib/tor" ]
    networks:
      proxy_net:
        ipv4_address: "10.133.7.10"
    restart: "unless-stopped"

  # ── Vault Service ───────────────────────────────────────────────
  vault_srvc:
    build: "./vault_srvc"
    container_name: "vault_service"
    hostname: "vault.${PROJECT_NAME}-${VAULT_NAMESPACE}"
    env_file: ".env"
    expose: [ "${VAULT_PORT}" ]
    volumes:  [ "vault_data:/vault", "tor_data:/tor" ]
    networks:
      service_net:
        ipv4_address: "10.133.7.18"
      proxy_net:
        ipv4_address: "10.133.7.12"
      ai_net:
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${HTTP}vault.${PROJECT_NAME}-${VAULT_NAMESPACE}:${VAULT_PORT}/v1/sys/health"]
      <<: *health
    restart: "no"
    cap_add: [ "IPC_LOCK" ]
    develop:
      watch:
        - path: "./vault_srvc/tools/entrypoint.sh"
          action: "rebuild"

  mkp224o_x:
    command: "-d /keys -S 1 -n 1 -T x"
    <<: *vanity

  mkp224o_vault:
    command: "-d /keys -S 1 -n 1 -T ${VANITY_ADDRESS_VAULT}"
    <<: *vanity

  mkp224o_main:
    command: "-d /keys -S 1 -n 1 -T ${VANITY_ADDRESS_MAIN}"
    <<: *vanity

  # ── nginx ───────────────────────────────────────────────────────
  nginx:
    build: "./nginx_proxy"
    container_name: "${NGINX_CODENAME}_${REV_PROXY_NAMESPACE}"
    hostname: "${NGINX_CODENAME}.${PROJECT_NAME}-${REV_PROXY_NAMESPACE}"
    ports:  ["${EXT}${NGINX_TCP}", "${EXT}${NGINX_TLS}", "${EXT}${NGINX_UDP}" ]
    depends_on: [ "frontend", "game_srvc" ]
    volumes:
      - "./nginx_proxy/conf/nginx.conf:/etc/nginx/nginx.conf.tmp:ro"
      - type: "volume"
        <<: *type-inject
      - type: "volume"
        <<: *type-ca-root
      - type: "volume"
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "share/${NGINX_CODENAME}_${REV_PROXY_NAMESPACE}"
    networks:
      service_net:
        ipv4_address: "10.133.7.25"
      proxy_net:
        ipv4_address: "10.133.7.11"
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${HTTP}${NGINX_CODENAME}.${PROJECT_NAME}-${REV_PROXY_NAMESPACE}:1337/healthcheck"]
      <<: *health
    restart: "unless-stopped"

volumes:  { "postgres_data", "mongo_data", "avatar_uploads",
          "ai_models", "ai_logs", "tor_data", "vault_data" }

networks:
  service_net:
    <<: *net
    ipam: {config: [subnet: "${SERVICE_SUBNET}"]}
  proxy_net:
    <<: *net
    ipam: {config: [subnet: "${PROXY_SUBNET}"]}
  ai_net:
    <<: *net
    ipam: {config: [subnet: "${AI_SUBNET}"]}
