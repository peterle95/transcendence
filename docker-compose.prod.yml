# ============================================================================
# Docker Compose – Secret Management
# ============================================================================

name: "${PROJECT_NAME?run make env}"

x-type-script: &type-inject
    source: "vault_data"
    target: "/inject"
    read_only: true
    volume:
      nocopy: true
      subpath: "distribute/inject"

x-type-ca-root: &type-ca-root
    source: "vault_data"
    target: "${CA_ROOT_DIR}"
    read_only: true
    volume:
      nocopy: true
      subpath: "distribute/cacert"

x-type-ca-cert: &type-ca-cert
    source: "vault_data"
    target: "/certs"
    read_only: true

x-health: &health
  start_period:   "${GRACE_PERIOD}m"
  start_interval: "${GRACE_PERIOD}0s"
  interval:       1m
  timeout:        45s
  retries:        "${GRACE_PERIOD}0"

x-depends-on-vault: &depends-on-vault
  depends_on:
    vault_srvc:
      condition: "service_healthy"

x-ai-srvc:  &ai-srvc
    build: "./AI_srvc"
    <<: *depends-on-vault 
    volumes:
      - "ai_models:/app/models:ro"
      - "ai_logs:/app/logs"
      - type: volume
        <<: *type-inject
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/ai_srvc"
    networks: [ "ai_net" ]
    restart: unless-stopped

x-vanity: &vanity
    image: "ghcr.io/cathugger/mkp224o:master"
    volumes: [ "tor_data:/keys" ]
    deploy:
      mode: "global-job"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    build: "./postgres_db"
    container_name: "postgres_${DATABASE_NAMESPACE}"
    hostname: "postgres.${PROJECT_NAME}-${DATABASE_NAMESPACE}"
    expose: [ "${POSTGRES_PORT}" ]
    <<: *depends-on-vault 
    volumes:
      - "postgres_data:${POSTGRES_DATA_DIR}"
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/postgres_${DATABASE_NAMESPACE}"
    networks:
      backend_net:
        ipv4_address: 10.133.7.24
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT}"]
      <<: *health
    restart: unless-stopped

  # ── MongoDB ─────────────────────────────────────────────────────
  mongo:
    build: "./mongo_db"
    container_name: "mongo_${DATABASE_NAMESPACE}"
    hostname: "mongo.${PROJECT_NAME}-${DATABASE_NAMESPACE}"
    expose: [ "${MONGO_PORT}" ]
    <<: *depends-on-vault 
    volumes:
      - "mongo_data:/data/db"
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/mongo_${DATABASE_NAMESPACE}"
    networks:
      backend_net:
        ipv4_address: 10.133.7.23
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      <<: *health
    restart: unless-stopped

  # ── Auth Service ────────────────────────────────────────────────
  auth_srvc:
    build: "./auth_srvc"
    container_name: "auth_service"
    hostname: "auth.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    ports: [ "127.0.0.1:3000:${AUTH_PORT}" ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "avatar_uploads:/app/uploads/avatars"
      - type: volume
        <<: *type-inject
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/auth_srvc"
    networks:
      backend_net:
        ipv4_address: 10.133.7.22
    restart: unless-stopped

  # ── Chat Service ────────────────────────────────────────────────
  chat_srvc:
    build: "./chat_srvc"
    container_name: "chat_service"
    hostname: "chat.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    ports: [ "127.0.0.1:3001:${CHAT_PORT}" ]
    depends_on: [ "mongo" ]
    volumes:
      - type: volume
        <<: *type-inject
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/chat_srvc"
    networks:
      backend_net:
        ipv4_address: 10.133.7.21
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:  "./frontend"
    container_name: "frontend_service"
    hostname: "frontend.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    ports: [ "127.0.0.1:3003:${FRONTEND_PORT}" ]
    depends_on: [ "auth_srvc", "chat_srvc" ]
    volumes:
      - type: volume
        <<: *type-inject
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/frontend"
    networks:
      backend_net:
        ipv4_address: 10.133.7.20
    restart: unless-stopped

  # ── Game Service ────────────────────────────────────────────────
  game_srvc:
    build: "./game_srvc"
    container_name: "game_service"
    hostname: "game.${PROJECT_NAME}-${SERVICE_NAMESPACE}"
    ports: [ "127.0.0.1:3002:${GAME_PORT}", "127.0.0.1:4000:${GAME_WS_PORT}" ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: volume
        <<: *type-inject
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/game_srvc"
    networks:
      backend_net:
        ipv4_address: 10.133.7.19
      ai_net:
    restart: unless-stopped

  # ── AI Service (DQN Player Bots) ────────────────────────────────
#  ai_srvc:
#    container_name: "ai_service"
#    hostname: "ai-1.${PROJECT_NAME}-${AI_NAMESPACE}"
#    <<: *ai-srvc
#
#  ai_srvc_slot2:
#    hostname: "ai-2.${PROJECT_NAME}-${AI_NAMESPACE}"
#    container_name: "ai_service_slot2"
#    <<: *ai-srvc
#
#  ai_srvc_slot3:
#    hostname: "ai-3.${PROJECT_NAME}-${AI_NAMESPACE}"
#    container_name: "ai_service_slot3"
#    <<: *ai-srvc

  # ── Tor ─────────────────────────────────────────────────────────
  tor:
    build: "./tor"
    container_name: "${TOR_CODENAME}_${REV_PROXY_NAMESPACE}"
    hostname: "${TOR_CODENAME}.${PROJECT_NAME}-${REV_PROXY_NAMESPACE}"
    ports:  [ "${HIDDEN_SERVICE_PORT}:9050" ]
    <<: *depends-on-vault
    volumes:
      - "tor_data:/var/lib/tor"
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/${TOR_CODENAME}_${REV_PROXY_NAMESPACE}"
    networks:
      proxy_net:
        ipv4_address: 10.42.42.2
    restart: unless-stopped

  # ── Vault Service ───────────────────────────────────────────────
  vault_srvc:
    build: "./vault_srvc"
    container_name: "vault_service"
    hostname: "vault.${PROJECT_NAME}-${VAULT_NAMESPACE}"
    env_file: ".env"
    expose: [ "${VAULT_PORT}" ]
    depends_on:
      mkp224o_main:
        condition: service_completed_successfully
      mkp224o_vault:
        condition: service_completed_successfully
    volumes:  [ "vault_data:/vault", "tor_data:/tor" ]
    networks:
      backend_net:
        ipv4_address: 10.133.7.18
      proxy_net:
        ipv4_address: 10.42.42.4
      ai_net:
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${HTTP}vault.${PROJECT_NAME}-${VAULT_NAMESPACE}:${VAULT_PORT}/v1/sys/health"]
      <<: *health
    restart: no
    cap_add: [ IPC_LOCK ]
    develop:
      watch:
        - path: "./vault_srvc/tools/entrypoint.sh"
          action: rebuild

  mkp224o_vault:
    command: "-d /keys -S 1 -n 1 -T ${VANITY_ADDRESS_VAULT}"
    <<: *vanity

  mkp224o_main:
    command: "-d /keys -S 1 -n 1 -T ${VANITY_ADDRESS_MAIN}"
    <<: *vanity

  # ── nginx ───────────────────────────────────────────────────────
  nginx:
    build: "./nginx_docker"
    container_name: "${NGINX_CODENAME}_${REV_PROXY_NAMESPACE}"
    hostname: "${NGINX_CODENAME}.${PROJECT_NAME}-${REV_PROXY_NAMESPACE}"
    ports:  [ "${NGINX_PORT_EXTERNAL}:${NGINX_PORT}" ]
    depends_on: [ "frontend", "game_srvc" ]
    volumes:
      - "./nginx_docker/conf/nginx.conf:/etc/nginx/nginx.conf.tmp:ro"
      - type: volume
        <<: *type-inject
      - type: volume
        <<: *type-ca-root
      - type: volume
        <<: *type-ca-cert
        volume:
          nocopy: true
          subpath: "distribute/${NGINX_CODENAME}_${REV_PROXY_NAMESPACE}"
    networks:
      backend_net:
        ipv4_address: 10.133.7.25
      proxy_net:
        ipv4_address: 10.42.42.3
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${HTTP}${NGINX_CODENAME}.${PROJECT_NAME}-${REV_PROXY_NAMESPACE}:1337/healthcheck"]
      <<: *health
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  avatar_uploads:
  tor_data:
  vault_data:
  ai_models:
  ai_logs:

networks:
  backend_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 10.133.7.16/28
  proxy_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/29
  ai_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/28
