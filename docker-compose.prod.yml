# ============================================================================
# Docker Compose – PRODUCTION
# All service ports bound to 127.0.0.1; only Nginx is public.
# ============================================================================

name: transcendence

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    hostname: "postgres.transcendence-db"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    depends_on:
      vault_srvc:
        condition: service_healthy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/postgres_db"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MongoDB ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: mongo_db
    hostname: "mongo.transcendence-db"
    expose:
      - "27017"
    depends_on:
      vault_srvc:
        condition: service_healthy
    volumes:
      - mongo_data:/data/db
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/mongo_db"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 30s        # was 5s — mongosh is slow on low RAM on VPS
      retries: 3
      start_period: 60s   # give it time on container start
    restart: unless-stopped

  # ── Auth Service ────────────────────────────────────────────────
  auth_srvc:
    build: ./auth_srvc
    container_name: auth_service
    hostname: "auth.transcendence-backend"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - CORS_ALLOWED_ORIGIN=${PUBLIC_URL:-http://localhost:3003}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
      - NEXTAUTH_URL=${PUBLIC_URL:-http://localhost:3003}/auth # Added /auth to route NextAuth correctly behind Nginx
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - avatar_uploads:/app/uploads/avatars
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/auth_srvc"
    networks:
      - backend_net
    restart: unless-stopped

  # ── Chat Service ────────────────────────────────────────────────
  chat_srvc:
    build:
      context: ./chat_srvc
      args:
        - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth        # baked into the bundle
    container_name: chat_service
    hostname: "chat.transcendence-backend"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/chat-service
      - AUTH_SERVICE_URL=http://auth_srvc:3000
      - SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - SOCKET_IO_ALLOWLIST=${PUBLIC_URL:-http://localhost:3001}
      - SOCKET_PATH=/chat/socket.io/                # Explicit socket path for Nginx single-host routing
      - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth          # also set at runtime for API routes
      - NEXT_PUBLIC_GAME_SERVICE_URL=/game          # used in game-invite route
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/chat_srvc"
    networks:
      - backend_net
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth # Bake the correct public auth subpath into frontend bundle
    container_name: frontend_service
    hostname: "frontend.transcendence-backend"
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - AUTH_SERVICE_URL=http://auth_srvc:3000
      - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth
      - NODE_ENV=production
    depends_on:
      auth_srvc:
        condition: service_started
      chat_srvc:
        condition: service_started
    volumes:
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/frontend"
    networks:
      - backend_net
    restart: unless-stopped

  # ── Game Service ────────────────────────────────────────────────
  game_srvc:
    build:
      context: ./game_srvc
      args:
        - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth
        - NEXT_PUBLIC_GAME_SERVICE_URL=/game
    container_name: game_service
    hostname: "game.transcendence-backend"
    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:4000:4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/game_db
      - AUTH_SERVICE_URL=http://auth_srvc:3000
      - SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - SOCKET_IO_ALLOWLIST=${PUBLIC_URL:-http://localhost:3002}
      - SOCKET_PATH=/game/socket.io/ # Explicit socket path for Nginx single-host routing
      - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth
      - NEXT_PUBLIC_GAME_SERVICE_URL=/game
      - PORT=4000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/game_srvc"
    networks:
      - backend_net
    restart: unless-stopped

  # ── Caddy ───────────────────────────────────────────────────────
  caddy:
    container_name: "clear_proxy"
    hostname: "clear.transcendence-proxy"
    build: "./caddy"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend_net
      - proxy_net
    depends_on:
      tor:
        condition: service_started
    volumes:
      - ./caddy/conf:/etc/caddy
      - caddy_data:/data
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/clear_proxy"

  # ── Tor ─────────────────────────────────────────────────────────
  tor:
    container_name: "dark_proxy"
    hostname: "dark.transcendence-proxy"
    build: "./tor"
    restart: unless-stopped
    ports:
      - "9050:9050"
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "curl --socks5-hostname 127.0.0.1:9050 http://$(cat /var/lib/tor/hidden_services/main/hostname)"]
      start_period:   1m
      start_interval: 20s
      interval:       45s
      timeout:        1m
      retries:        3
    depends_on:
      vault_srvc:
        condition: service_healthy
    volumes:
      - "tor_data:/data"
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/dark_proxy"

  # ── Vault Service ───────────────────────────────────────────────
  vault_srvc:
    build: "./vault_srvc"
    container_name: vault_service
    hostname: "vault.transcendence-secret"
    expose:
      - "8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://vault.transcendence-secret:8200/v1/sys/health"]
      start_period:   1m
      start_interval: 20s
      interval:       45s
      timeout:        1m
      retries:        3
    volumes:
      - "vault_data:/vault/"
    networks:
      - backend_net
      - proxy_net
    restart: no
    cap_add:
      - IPC_LOCK

  # ── AI Service (DQN Player Bots) ────────────────────────────────
  ai_srvc:
    build: ./AI_srvc
    container_name: ai_service
    environment:
      - GAME_SVC_URL=http://game_srvc:4000
      - SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - ROOM_ID=gameplay-room
      - AI_SLOT=1
      - MODEL_PATH=/app/models/live/dqn_latest.pt
      - MODEL_AUTO_RELOAD=true
      - MODEL_RELOAD_INTERVAL_S=5
      - TRAINING_MODE=false
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models:ro
      - ai_logs:/app/logs
    depends_on:
      - game_srvc
    networks:
      - app_network
    restart: unless-stopped

  ai_srvc_slot2:
    build: ./AI_srvc
    container_name: ai_service_slot2
    environment:
      - GAME_SVC_URL=http://game_srvc:4000
      - SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - ROOM_ID=gameplay-room
      - AI_SLOT=2
      - MODEL_PATH=/app/models/live/dqn_latest.pt
      - MODEL_AUTO_RELOAD=true
      - MODEL_RELOAD_INTERVAL_S=5
      - TRAINING_MODE=false
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models:ro
      - ai_logs:/app/logs
    depends_on:
      - game_srvc
    networks:
      - app_network
    restart: unless-stopped

  ai_srvc_slot3:
    build: ./AI_srvc
    container_name: ai_service_slot3
    environment:
      - GAME_SVC_URL=http://game_srvc:4000
      - SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - ROOM_ID=gameplay-room
      - AI_SLOT=3
      - MODEL_PATH=/app/models/live/dqn_latest.pt
      - MODEL_AUTO_RELOAD=true
      - MODEL_RELOAD_INTERVAL_S=5
      - TRAINING_MODE=false
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models:ro
      - ai_logs:/app/logs
    depends_on:
      - game_srvc
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  avatar_uploads:
    driver: local
  caddy_data:
    driver: local
  tor_data:
    driver: local
  vault_data:
    driver: local
  ai_models:
    driver: local
  ai_logs:
    driver: local

networks:
  backend_net:
    driver: bridge
    enable_ipv6: false
#    ipam:
#      driver: default
#      config:
#        - subnet: 133.7.42.9
#          ip_range:
#          gateway:
#          aux_addresses:
  proxy_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 133.7.42.0/29
          ip_range: 133.7.42.0/29
          gateway: 133.7.42.6
          aux_addresses:
            dark.transcendence-proxy: 133.7.42.2
            clear.transcendence-proxy: 133.7.42.3
            vault.transcendence-backend: 133.7.42.4
