volumes:
  postgres_data:  &default-driver
    driver: local
  mongo_data:     *default-driver
  avatar_uploads: *default-driver
#  caddy_data:     *default-driver
  tor_data:       *default-driver
  vault_data:     *default-driver
  ai_models:      *default-driver
  ai_logs:        *default-driver

networks:
  backend_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 133.7.42.16/28
  proxy_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 133.7.42.0/29
