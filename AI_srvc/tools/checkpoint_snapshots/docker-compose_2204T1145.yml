# ============================================================================
# Docker Compose - Architecture Blueprint
# ============================================================================

services:
  # ========================================
  # PostgreSQL Database
  # Used by: Auth Service (future), Game Service (future)
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      # Create multiple databases for different services
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize multiple databases on startup
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # MongoDB Database
  # Used by: Chat Service (functional)
  # ========================================
  mongo:
    image: mongo:7-jammy
    container_name: mongo_db
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Auth Service - ✅ FUNCTIONAL
  # Handles authentication, user management, and friendships
  # ========================================
  auth_srvc:
    build: ./auth_srvc
    container_name: auth_service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/auth_db
      - AUTH_SECRET=3f4b9c1c0c6a2f2a8e7d9c4b1a5e6f0c3b7d2a1f9e8c6b5d4a3f2c1e0b9a8d7
      - NEXTAUTH_URL=http://localhost:8080/auth
      - CORS_ALLOWED_ORIGIN=http://localhost:8080
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - NODE_ENV=production
    command: sh -c "npx prisma migrate deploy && npx next start -H 0.0.0.0 -p 3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # ========================================
  # Chat Service - ✅ FUNCTIONAL
  # The ONLY fully implemented service
  # ========================================
  chat_srvc:
    build: ./chat_srvc
    container_name: chat_service
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/chat-service
      - AUTH_SERVICE_URL=http://auth_srvc:3000/auth
      - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth
      - NEXT_PUBLIC_GAME_SERVICE_URL=/game
      - SOCKET_IO_ALLOWLIST=http://localhost:8080
      - SOCKET_PATH=/chat/socket.io/
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - HOSTNAME=0.0.0.0
      - NODE_ENV=development
    depends_on:
      mongo:
        condition: service_healthy
      auth_srvc:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

  # Frontend
  #
  #
  frontend:
    build: ./frontend
    container_name: frontend_service
    ports:
      - "3003:3003"
    environment:
      - AUTH_SERVICE_URL=http://auth_srvc:3000/auth
      - NEXT_PUBLIC_AUTH_SERVICE_URL=/auth
      - CHAT_SERVICE_URL=http://chat_srvc:3001
      - NEXT_PUBLIC_CHAT_SERVICE_URL=/chat
      - GAME_SERVICE_URL=http://game_srvc:3002
      - NEXT_PUBLIC_GAME_SERVICE_URL=/game
      - NODE_ENV=production
    command: npx next start -H 0.0.0.0 -p 3003
    depends_on:
      - auth_srvc
      - chat_srvc
    networks:
      - app_network

  # Game Service - Serves games from public/games/
  game_srvc:
    build: ./game_srvc
    container_name: game_service
    ports:
      - "3002:3002"
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/game_db
      - AUTH_SERVICE_URL=http://auth_srvc:3000/auth
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - SOCKET_CORS_ORIGIN=http://localhost:8080
      - SOCKET_PORT=4000
      - SOCKET_IO_ALLOWLIST=http://localhost:8080
      - SOCKET_PATH=/game/socket.io/
      - GAME_ROOM_ID=gameplay-room
      - ENABLE_TRAINING_ROOM=false
      - REMOTE_MULTIPLAYER_ENABLED=false
      - NODE_ENV=production
    command: sh -c "npm run start:socket & npx next start -H 0.0.0.0 -p 3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth_srvc:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

  # Dedicated training game server instance (isolated from player gameplay)
  game_srvc_train:
    build: ./game_srvc
    container_name: game_train_service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/game_db
      - AUTH_SERVICE_URL=http://auth_srvc:3000/auth
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - SOCKET_CORS_ORIGIN=http://localhost:8080
      - SOCKET_PORT=4000
      - SOCKET_IO_ALLOWLIST=http://localhost:8080
      - SOCKET_PATH=/game/socket.io/
      - GAME_ROOM_ID=training-room
      - ENABLE_TRAINING_ROOM=true
      - TRAINING_SCENARIO=${TRAINING_SCENARIO:-combat}
      - NODE_ENV=development
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      auth_srvc:
        condition: service_started
    profiles:
      - training
    networks:
      - app_network
    restart: "no"

# ============================================================================
# Aggiungi questo blocco al docker-compose.yml esistente, nella sezione services:
# ============================================================================

  # ========================================
  # AI Service - DQN Player
  # Socket.IO client: riceve ai_game_state e invia ai_command
  # ========================================
  ai_srvc:
    build: ./AI_srvc
    container_name: ai_service
    environment:
      - GAME_SVC_URL=http://game_srvc:4000
      - SOCKET_PATH=/game/socket.io/
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - ROOM_ID=gameplay-room
      - AI_SLOT=1
      - MODEL_PATH=/app/models/train/dqn_latest.pt
      - MODEL_AUTO_RELOAD=true
      - MODEL_RELOAD_INTERVAL_S=5
      - TRAINING_MODE=false   # true = training contro bot, false = inference live
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models:ro  # inference reads stable model only
      - ai_logs:/app/logs
    depends_on:
      - game_srvc
    networks:
      - app_network
    restart: unless-stopped

  ai_srvc_slot2:
    build: ./AI_srvc
    container_name: ai_service_slot2
    environment:
      - GAME_SVC_URL=http://game_srvc:4000
      - SOCKET_PATH=/game/socket.io/
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - ROOM_ID=gameplay-room
      - AI_SLOT=2
      - MODEL_PATH=/app/models/train/dqn_latest.pt
      - MODEL_AUTO_RELOAD=true
      - MODEL_RELOAD_INTERVAL_S=5
      - TRAINING_MODE=false
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models:ro
      - ai_logs:/app/logs
    depends_on:
      - game_srvc
    networks:
      - app_network
    restart: unless-stopped

  ai_srvc_slot3:
    build: ./AI_srvc
    container_name: ai_service_slot3
    environment:
      - GAME_SVC_URL=http://game_srvc:4000
      - SOCKET_PATH=/game/socket.io/
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - ROOM_ID=gameplay-room
      - AI_SLOT=3
      - MODEL_PATH=/app/models/train/dqn_latest.pt
      - MODEL_AUTO_RELOAD=true
      - MODEL_RELOAD_INTERVAL_S=5
      - TRAINING_MODE=false
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models:ro
      - ai_logs:/app/logs
    depends_on:
      - game_srvc
    networks:
      - app_network
    restart: unless-stopped

  # One-shot training worker, launched on demand: docker compose up ai_train
  ai_train_bot:
    build: ./AI_srvc
    container_name: ai_train_bot_service
    environment:
      - GAME_SVC_URL=http://game_srvc_train:4000
      - SOCKET_PATH=/game/socket.io/
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - ROOM_ID=training-room
      - AI_SLOT=2
      - BOT_MODE=scripted
      - TRAINING_MODE=false
      - LOG_LEVEL=INFO
    volumes:
      - ai_logs:/app/logs
    depends_on:
      game_srvc_train:
        condition: service_healthy
    profiles:
      - training
    networks:
      - app_network
    restart: on-failure

  # Continuous training worker, launched on demand with training profile
  ai_train:
    build: ./AI_srvc
    container_name: ai_train_service
    environment:
      - GAME_SVC_URL=http://game_srvc_train:4000
      - SOCKET_PATH=/game/socket.io/
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - MODEL_PATH=/app/models/train/dqn_latest.pt
      - ROOM_ID=training-room
      - AI_SLOT=1
      - TRAIN_AI_SLOTS=1,2
      - TRAIN_CHECKPOINT_PATH=/app/models/train/dqn_training_checkpoint.pt
      - TRAIN_AUDIT_LOG_PATH=/app/training/AI_Training_Log.md
      - TRAIN_AUDIT_EVERY=250
      - WIN_RATE_WINDOW_EPISODES=50
      - TRAINING_SCENARIO=${TRAINING_SCENARIO:-baseline}	#curriculum bootstrap: baseline -> combat
      - TRAIN_STEPS=20000
      - DQN_EPSILON_START=1
      - DQN_EPSILON_END=0.09
      - DQN_EPSILON_DECAY_STEPS=150000
      - DQN_LR=0.00003
      - TRAINING_MODE=true
      - TRAIN_EVAL_ONLY=false
      - TRAIN_RESUME=true
      - REWARD_WIN=1.2
      - REWARD_DEATH=-1
      - REWARD_HIT=2
      - REWARD_HURT_METEOR=-0.50
      - REWARD_HURT_LASER=-0.50
      - REWARD_ALIVE_STEP=0.05
      - REWARD_METEOR_DANGER=-0.05
      - METEOR_DANGER_DISTANCE_NORM=0.12
      - REWARD_ROTATE_DANGER=0.0000
      - REWARD_ROTATE_STEP=0.000
      - ROTATION_DANGER_DISTANCE_NORM=0
      - REWARD_APPROACH_ENEMY=0.15
      - REWARD_WASTED_SHOT=-0.5
      - REWARD_LOW_ENERGY=-0.1	#Laser energy ant-waste policy
      - LOW_ENERGY_THRESHOLD=10 #Laser
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models
      - ai_logs:/app/logs 
      - ./AI_srvc/training:/app/training
    depends_on:
      game_srvc_train:
        condition: service_healthy
      ai_train_bot:
        condition: service_started
    profiles:
      - training
    networks:
      - app_network
    restart: on-failure

  # ========================================
  # Nginx Gateway (Local Proxy)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: local_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth_srvc
      - chat_srvc
      - game_srvc
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  ai_models:
    driver: local
  ai_logs:
    driver: local

networks:
  app_network:
    driver: bridge

# ============================================================================
# Quick Start
# ============================================================================
#
# Access Chat Service:
#   http://localhost:8080/chat/api/chat/send
#   http://localhost:8080/chat/api/chat/history
#
# Connect to databases:
#   PostgreSQL: postgresql://postgres:password@localhost:5433/
#   MongoDB: mongodb://localhost:27017/
#
# View logs:
#   docker-compose logs -f chat_srvc
#
# Stop services:
#   docker-compose down
# ============================================================================
