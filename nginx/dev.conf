# Nginx Single-host path-based reverse proxy for local development
# Maps to port 8080 in docker-compose.yml

upstream frontend_upstream  { server frontend:3003; }
upstream auth_upstream      { server auth_srvc:3000; }
upstream chat_upstream      { server chat_srvc:3001; }
upstream game_upstream      { server game_srvc:3002; }
upstream game_ws_upstream   { server game_srvc:4000; }

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # Game Assets
    location /assets/ {
        # Note: In docker-compose, we need to map a volume to /opt/transcendence/code_base/game_srvc/public/assets
        # OR simply route it to the game_srvc since the game_srvc serves static files too
        # Actually, let's proxy to the game service directly just like the game route,
        # but in production Nginx serves it via alias. For dev, game_srvc serving it is fine, or we map volume.
        # Nginx dev container inside docker compose can directly proxy for simplicity.
        proxy_pass http://game_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/me {
        proxy_pass http://game_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Auth Service
    location /auth/ {
        proxy_pass http://auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Chat Service
    location /chat {
        proxy_pass http://chat_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Chat WebSocket
    location /chat/socket.io/ {
        proxy_pass http://chat_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Game Service
    location /game {
        proxy_pass http://game_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Game WebSocket
    location /game/socket.io/ {
        proxy_pass http://game_ws_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
