# Nginx Single-host path-based reverse proxy for local development
# Maps to port 8080 in docker-compose.yml

upstream frontend_upstream  { server frontend:3003; }
upstream auth_upstream      { server auth_srvc:3000; }
upstream chat_upstream      { server chat_srvc:3001; }
upstream game_upstream      { server game_srvc:3002; }
upstream game_ws_upstream   { server game_srvc:4000; }

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # Game Assets (Rewriting to /game/assets/ to match game_srvc basePath)
    location /assets/ {
        rewrite ^/assets/(.*) /game/assets/$1 break;
        proxy_pass http://game_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # game_srvc uses Next.js basePath '/game' — route must be /game/api/auth/me, not /api/auth/me
    location = /api/auth/me {
        proxy_pass http://game_upstream/game/api/auth/me;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Frontend (React App)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Auth Service (Next.js with basePath: '/auth')
    location /auth {
        proxy_pass http://auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Chat Service (Next.js with basePath: '/chat')
    location /chat {
        proxy_pass http://chat_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Chat WebSocket — no trailing slash on location (matches /chat/socket.io?EIO=…)
    # Pass URI unchanged: chat Socket.IO listens on /chat/socket.io/ (SOCKET_PATH), not /socket.io.
    location /chat/socket.io {
        proxy_pass http://chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Game Service (Next.js with basePath: '/game')
    location /game {
        proxy_pass http://game_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Game WebSocket — no trailing slash on location (matches /game/socket.io?EIO=…)
    # Pass URI unchanged: game socket uses SOCKET_PATH=/game/socket.io/, not /socket.io.
    location /game/socket.io {
        proxy_pass http://game_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
