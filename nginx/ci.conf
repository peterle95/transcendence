# Nginx – CI config
# WHY THIS EXISTS: In production, Nginx runs on the VPS host and connects to
# containers via 127.0.0.1:<port>. In CI, Nginx runs INSIDE a Docker container,
# so 127.0.0.1 refers to itself. It must use Docker DNS names (auth_srvc, etc.)
# to reach the other containers on the shared network.
#
# The routing rules (location blocks) are identical to transcendance.conf.
# If you change a route in transcendance.conf, change it here too.

upstream frontend_upstream  { server frontend:3003; }
upstream auth_upstream      { server auth_srvc:3000; }
upstream chat_upstream      { server chat_srvc:3001; }
upstream game_upstream      { server game_srvc:3002; }
upstream game_ws_upstream   { server game_srvc:4000; }

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;

    # Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Auth Service — keep /auth prefix (auth_srvc has basePath '/auth')
    location /auth/ {
        proxy_pass http://auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Chat Service
    location /chat {
        proxy_pass http://chat_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Chat WebSocket
    location /chat/socket.io/ {
        proxy_pass http://chat_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Game Service
    location /game {
        proxy_pass http://game_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Game WebSocket (socket server on port 4000)
    location /game/socket.io/ {
        proxy_pass http://game_ws_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
