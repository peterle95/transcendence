# Nginx – Single-host path-based reverse proxy for Transcendance
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled.
# Then: sudo nginx -t && sudo systemctl reload nginx

upstream frontend_upstream  { server 127.0.0.1:3003; }
upstream auth_upstream      { server 127.0.0.1:3000; }
upstream chat_upstream      { server 127.0.0.1:3001; }
upstream game_upstream      { server 127.0.0.1:3002; }
upstream game_ws_upstream   { server 127.0.0.1:4000; }

server {
    listen 80;
    server_name spacesupremacy.duckdns.org;

    client_max_body_size 10M;

    # Game Assets
    location /assets/ {
        alias /opt/transcendence/code_base/game_srvc/public/assets/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # game_srvc uses Next.js basePath '/game' — route must be /game/api/auth/me, not /api/auth/me
    location = /api/auth/me {
        proxy_pass http://game_upstream/game/api/auth/me;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    }

    # Auth Service — proxy /auth/... to container keeping the /auth prefix
    # auth_srvc has basePath '/auth' so it expects full /auth/api/auth/... paths
    location /auth/ {
        proxy_pass http://auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Chat WebSocket — no trailing slash on location (matches /chat/socket.io?EIO=…)
    location /chat/socket.io {
        proxy_pass http://chat_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Chat Service
    location /chat {
        proxy_pass http://chat_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }

    # Game WebSocket — no trailing slash on location (matches /game/socket.io?EIO=…)
    location /game/socket.io {
        proxy_pass http://game_ws_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Game Service
    location /game {
        proxy_pass http://game_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
    }
}
