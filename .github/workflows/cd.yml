name: CD — Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH → GCP VM → docker compose up
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy via SSH
        id: compute_ssh
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: transcendence-server
          zone: europe-west10-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command: |
            set -exuo pipefail

            REPO_DIR="/opt/transcendence/code_base"
            CURRENT_USER=$(whoami)

            echo "==> Taking ownership of the codebase for the deploy user ($CURRENT_USER)"
            sudo chown -R "$CURRENT_USER" "$REPO_DIR"

            # Adding safe.directory is still good practice in CI
            git config --global --add safe.directory "$REPO_DIR"

            cd "$REPO_DIR"
            echo "==> Pulling latest main"
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            echo "==> Running deploy script"
            sudo /usr/local/bin/deploy_transcendence.sh

      - name: Print SSH stderr on failure
        if: failure()
        run: |
          echo "${{ steps.compute_ssh.outputs.stderr }}"

      # ── 3. Smoke check ───────────────────────────────────────────────────
      - name: Smoke check production
        run: |
          BASE="https://spacesupremacy.duckdns.org"

          check() {
            echo -n "  $1 ... "
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 "$BASE$1")
            if [ "$STATUS" = "$2" ]; then echo "OK ($STATUS)"
            else echo "FAIL (got $STATUS, expected $2)"; exit 1; fi
          }

          check "/auth/api/auth/csrf"  "200"
          check "/chat/"               "200"
          check "/game/"               "308"   # Next.js redirect to /game/games/...