name: CI

on:
  pull_request:
    branches: [main, vps_setup]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth_srvc, chat_srvc, game_srvc, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Generate Prisma client
        # Only runs for services that have a prisma schema
        if: ${{ hashFiles(format('{0}/prisma/schema.prisma', matrix.service)) != '' }}
        run: npx prisma generate
        working-directory: ${{ matrix.service }}

      - run: npx tsc --noEmit
        working-directory: ${{ matrix.service }}

  build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        service: [auth_srvc, chat_srvc, game_srvc, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max



  validate_manifests:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3
        
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: dummy
          AUTH_SECRET: dummy
          INTERNAL_SERVICE_SECRET: dummy
        
      - name: Validate Nginx configuration
        run: |
          docker run --rm -v $(pwd)/nginx:/etc/nginx/conf.d \
            nginx:alpine nginx -t -c /etc/nginx/conf.d/transcendance.conf