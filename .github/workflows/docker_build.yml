name: CI

on:
  pull_request:
    branches: [main, vps_setup, remote_multiplayer]
  push:
    branches: [main]

jobs:
  # ════════════════════════════════════════════════════════════════
  # Stage 1: Typecheck — catch compile errors in every TS service
  # ════════════════════════════════════════════════════════════════
  typecheck:
    name: Typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth_srvc, chat_srvc, game_srvc, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Generate Prisma client
        if: ${{ hashFiles(format('{0}/prisma/schema.prisma', matrix.service)) != '' }}
        run: npx prisma generate
        working-directory: ${{ matrix.service }}

      - run: npx tsc --noEmit
        working-directory: ${{ matrix.service }}

  # ════════════════════════════════════════════════════════════════
  # Stage 1b: AI Service checks — Python syntax, imports, model
  #
  # WHY A SEPARATE JOB (not inside the build stage):
  #   Docker build already proves the image compiles, but it gives
  #   no line-level feedback — a syntax error in model.py and a
  #   broken import in trainer.py both look like "build failed".
  #   This job runs in ~60 s and points directly at the broken file
  #   and line number, matching the DX of the TypeScript typecheck
  #   jobs above.
  #
  # TORCH INSTALL STRATEGY:
  #   torch CPU wheel is ~130 MB. We install it with pip caching
  #   (cache key = requirements.txt hash) so warm runs take < 5 s.
  #   We intentionally install the full requirements.txt so that a
  #   bad pin (e.g. a version that doesn't exist on the PyTorch whl
  #   index) is caught here rather than silently failing at runtime.
  # ════════════════════════════════════════════════════════════════
  ai_srvc_check:
    name: AI Service Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_srvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AI_srvc/requirements.txt

      # ── Step 1: Pure syntax check — zero dependencies required ──────────
      # py_compile parses every .py file through the CPython compiler front-end.
      # Catches: SyntaxError, IndentationError, mismatched brackets, invalid
      # f-string expressions, bare 'except' in the wrong place, etc.
      # Runs in < 1 s. Does NOT execute any import or top-level code.
      - name: Syntax check — py_compile all Python files
        run: |
          echo "Scanning Python files for syntax errors..."
          FILES=$(find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./__pycache__/*")

          FAILED=0
          for f in $FILES; do
            if ! python -m py_compile "$f" 2>&1; then
              echo "❌ Syntax error in: $f"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "Fix the syntax errors above before merging."
            exit 1
          fi
          echo "✅ All Python files pass syntax check"

      # ── Step 2: Install lightweight linters (no torch needed) ────────────
      # pyflakes: detects undefined names, unused imports, redefined-while-unused.
      # flake8:   wraps pyflakes + pycodestyle; we only enable error-class codes
      #           (E9xx = syntax at parse time, F63x = starred assignment issues,
      #            F7xx = assert/syntax, F82x = undefined names) to keep noise low.
      - name: Install linters (no torch required)
        run: pip install pyflakes==3.2.0 flake8==7.1.1

      - name: pyflakes — undefined names and unused imports
        run: |
          echo "Running pyflakes..."
          # pyflakes exits non-zero if it finds any issue.
          # We list files explicitly to skip __pycache__ dirs.
          python -m pyflakes \
            main.py \
            agent.py \
            model.py \
            replay_buffer.py \
            socketio_client.py \
            training/trainer.py \
            tools/promote_model.py \
            tools/emit_ai_state_burst.py
          echo "✅ pyflakes passed"

      - name: flake8 — error-class issues only (E9, F63, F7, F82)
        run: |
          echo "Running flake8 (error codes only)..."
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=__pycache__,.git
          echo "✅ flake8 passed"

      # ── Step 3: requirements.txt sanity checks ────────────────────────────
      # Verify every line is either a pinned version (==), a comment, an option
      # flag (--extra-index-url), or blank. Unpinned deps (>=, ~=, no pin) in a
      # production service are a reproducibility risk.
      - name: Check requirements.txt — all deps must be pinned with ==
        run: |
          echo "Checking requirements.txt for unpinned dependencies..."
          FAILED=0
          while IFS= read -r line; do
            # Skip blanks, comments, and option flags
            [[ -z "$line" || "$line" == \#* || "$line" == --* ]] && continue
            # A pinned dep looks like "package==version" (possibly with +cpu suffix)
            if ! echo "$line" | grep -qE '^[a-zA-Z0-9_.-]+\[?[a-zA-Z0-9_,]*\]?=='; then
              echo "❌ Unpinned dependency: $line"
              FAILED=1
            fi
          done < requirements.txt

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Fix: pin every dependency to an exact version with =="
            exit 1
          fi
          echo "✅ All dependencies are pinned"

      # ── Step 4: Install full dependency stack ────────────────────────────
      # This is the real smoke test for requirements.txt: if torch==X.Y.Z+cpu
      # does not exist on the PyTorch whl server, pip install fails here and
      # the PR is blocked before the image is ever built.
      # The pip cache (keyed by requirements.txt hash) makes warm runs fast.
      - name: Install torch (CPU) and all requirements
        run: |
          pip install torch \
            --index-url https://download.pytorch.org/whl/cpu \
            --quiet
          pip install -r requirements.txt --quiet
          echo "✅ All requirements installed successfully"

      # ── Step 5: Import resolution — verify every core module loads ────────
      # Python resolves all top-level imports at import time. This catches:
      #   - Missing packages that weren't in requirements.txt
      #   - Circular imports
      #   - MODULE-level code that crashes on startup (e.g. a bad os.getenv cast)
      # We import each module directly rather than running main.py to avoid
      # triggering asyncio.run() or socket connections.
      - name: Import resolution — all core modules must import cleanly
        run: |
          echo "Verifying module imports..."

          python -c "
          import sys, importlib, traceback

          modules = [
              'model',
              'replay_buffer',
              'agent',
              'socketio_client',
          ]

          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
                  print(f'  ✅ {m}')
              except Exception as e:
                  print(f'  ❌ {m}: {e}')
                  traceback.print_exc()
                  failed.append(m)

          if failed:
              print(f'\nFailed imports: {failed}')
              sys.exit(1)
          print('All modules imported successfully')
          "

      # ── Step 6: model.py self-test ────────────────────────────────────────
      # model.py has an embedded __main__ block that:
      #   1. Builds the online + target network pair
      #   2. Runs a forward pass on a random batch of 32 states
      #   3. Calls get_action() and get_action_labels() on a single state
      #   4. Prints parameter count and action space size
      # This verifies that STATE_SIZE, ACTION_CHANNELS, and the network
      # architecture are internally consistent.
      - name: model.py — built-in architecture self-test
        run: |
          echo "Running model.py self-test..."
          python model.py
          echo "✅ model.py self-test passed"

      # ── Step 7: State vector size consistency check ───────────────────────
      # The assert in build_state_vector() (socketio_client.py) guards against
      # a mismatch between the feature count computed at runtime and STATE_SIZE
      # defined in model.py. This test exercises that assert with a synthetic
      # payload — it will fail if someone adds a feature group to build_state_vector
      # without updating the constants in model.py (or vice versa).
      - name: State vector — size consistency across model.py and socketio_client.py
        run: |
          echo "Verifying build_state_vector output matches STATE_SIZE..."
          python -c "
          import torch
          from model import STATE_SIZE
          from socketio_client import build_state_vector

          # Synthetic payload that mirrors a real ai_game_state event.
          # Uses maximum population (N_ENEMIES enemies, N_LASERS lasers,
          # N_METEORS meteors) so no padding branch is skipped.
          payload = {
              'my_ship': {
                  'x': 640, 'y': 360, 'angle': 90,
                  'vx': 1.0, 'vy': -0.5,
                  'energy': 20, 'hp': 15, 'alive': True, 'radius': 40,
              },
              'enemies': [
                  {'x': 900, 'y': 200, 'angle': 270, 'hp': 20, 'alive': True},
              ],
              'lasers': [
                  {'x': 700, 'y': 300, 'is_enemy': True},
                  {'x': 600, 'y': 400, 'is_enemy': False},
                  {'x': 500, 'y': 500, 'is_enemy': True},
              ],
              'meteors': [
                  {'x': 200, 'y': 100, 'radius': 50, 'alive': True},
                  {'x': 300, 'y': 600, 'radius': 22, 'alive': True},
                  {'x': 800, 'y': 400, 'radius': 14, 'alive': True},
              ],
          }

          vec = build_state_vector(payload)

          assert isinstance(vec, torch.Tensor), 'Expected torch.Tensor'
          assert vec.shape == (STATE_SIZE,), \
              f'Shape mismatch: got {vec.shape}, expected ({STATE_SIZE},)'
          assert not torch.isnan(vec).any(), 'State vector contains NaN'
          assert not torch.isinf(vec).any(), 'State vector contains Inf'

          # Also verify the assert inside build_state_vector fires correctly
          # for a truncated payload (fewer objects than N_* — tests padding).
          sparse = {'my_ship': payload['my_ship'], 'enemies': [], 'lasers': [], 'meteors': []}
          vec_sparse = build_state_vector(sparse)
          assert vec_sparse.shape == (STATE_SIZE,), \
              f'Sparse shape mismatch: {vec_sparse.shape}'

          print(f'STATE_SIZE={STATE_SIZE}  vector.shape={tuple(vec.shape)}  ✅')
          print('Padding path (empty enemies/lasers/meteors) ✅')
          "

      # ── Step 8: DQNAgent smoke test ───────────────────────────────────────
      # Verifies: agent construction, select_action(), remember(), train_step()
      # (one batch worth of transitions), and checkpoint_state() / restore().
      # A corrupted action dict key (e.g. "movimiento" instead of "movimento")
      # would be caught here because train_step() iterates ACTION_CHANNELS.keys().
      - name: DQNAgent — smoke test (select, remember, train step, checkpoint)
        run: |
          echo "Running DQNAgent smoke test..."
          python -c "
          import torch
          from agent import DQNAgent, AgentConfig
          from model import STATE_SIZE, ACTION_CHANNELS

          cfg = AgentConfig(batch_size=8, replay_capacity=50)
          agent = DQNAgent(cfg)

          # Fill replay buffer past batch_size so train_step() executes
          state      = torch.rand(STATE_SIZE)
          next_state = torch.rand(STATE_SIZE)

          for _ in range(cfg.batch_size + 2):
              action = agent.select_action(state, explore=True)
              assert set(action.keys()) == set(ACTION_CHANNELS.keys()), \
                  f'Action keys mismatch: {action.keys()} vs {ACTION_CHANNELS.keys()}'
              agent.remember(state, action, 0.1, next_state, False)

          loss = agent.train_step()
          assert loss is not None, 'train_step() returned None — replay buffer too small?'
          assert loss >= 0.0,       f'Negative loss: {loss}'

          # Checkpoint round-trip
          ckpt = agent.checkpoint_state()
          agent2 = DQNAgent(cfg)
          agent2.restore_from_checkpoint(ckpt)
          assert agent2.train_steps == agent.train_steps, 'train_steps not restored'

          print(f'Loss={loss:.6f}  train_steps={agent.train_steps}  ✅')
          "

      # ── Step 9: ReplayBuffer round-trip ──────────────────────────────────
      # Serialise → clear → deserialise and verify contents survive intact.
      # Catches bugs in to_serializable() / load_serializable() that would
      # silently corrupt or lose training history across checkpoint restores.
      - name: ReplayBuffer — serialisation round-trip
        run: |
          python -c "
          from replay_buffer import ReplayBuffer

          buf = ReplayBuffer(capacity=10)
          for i in range(5):
              buf.push(
                  state=[float(i)] * 4,
                  action={'movimento': i % 3, 'rotazione': 0, 'sparo': 0},
                  reward=float(i),
                  next_state=[float(i + 1)] * 4,
                  done=(i == 4),
              )

          serialised = buf.to_serializable()
          buf2 = ReplayBuffer(capacity=10)
          buf2.load_serializable(serialised)

          assert len(buf2) == len(buf), f'Length mismatch: {len(buf2)} vs {len(buf)}'
          for t in buf2.sample(len(buf2)):
              assert isinstance(t.reward, float), 'reward not float after round-trip'
              assert isinstance(t.done,   bool),  'done not bool after round-trip'

          print(f'ReplayBuffer round-trip OK (len={len(buf2)})  ✅')
          "

  # ════════════════════════════════════════════════════════════════
  # Stage 2: Docker build — verify all images build successfully
  # ════════════════════════════════════════════════════════════════
  build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [typecheck, ai_srvc_check]
    strategy:
      matrix:
        service: [auth_srvc, chat_srvc, game_srvc, frontend, AI_srvc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════
  # Stage 3: Validate deployment manifests
  # ════════════════════════════════════════════════════════════════
  validate_manifests:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: dummy
          AUTH_SECRET: dummy
          INTERNAL_SERVICE_SECRET: dummy

      - name: Validate Nginx production configuration
        run: |
          docker run --rm \
            -v $(pwd)/nginx/transcendance.conf:/etc/nginx/conf.d/transcendance.conf:ro \
            nginx:alpine nginx -t

  # ════════════════════════════════════════════════════════════════
  # Stage 4: Localhost URL guard — block hardcoded localhost in
  #          browser-facing code (bug that broke prod)
  #
  # WHAT THIS CHECKS:
  #   - next.config.js env blocks (values get baked into client bundles)
  #   - Client components (*.tsx in app/ directories)
  #   - Static JS served to browsers (game_srvc/public/)
  #
  # WHAT THIS SKIPS (safe to have localhost):
  #   - Server-side files: server.js, server.ts, proxy.ts, route.ts
  #   - Comments (lines starting with // or *)
  #   - docker-compose files, example.env, test files
  # ════════════════════════════════════════════════════════════════
  localhost_guard:
    name: Block hardcoded localhost URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded localhost in browser-facing code
        run: |
          echo "═══════════════════════════════════════════════════"
          echo " Scanning browser-facing code for hardcoded localhost..."
          echo "═══════════════════════════════════════════════════"

          FAILED=0

          # ── Check 1: next.config.js env blocks ──
          # These get baked into the JS bundle at build time.
          # Only flag ACTIVE lines (not commented out with //)
          echo ""
          echo "── Checking next.config.js files ──"
          CONFIG_MATCHES=$(grep -rn \
            --include="next.config.js" \
            --exclude-dir="node_modules" \
            -E "http://localhost:[0-9]+" \
            frontend/ chat_srvc/ game_srvc/ auth_srvc/ \
            2>/dev/null || true)

          # Filter out comment lines: match "file:line:  // ..."
          CONFIG_ACTIVE=$(echo "$CONFIG_MATCHES" | grep -vE "^[^:]+:[0-9]+:\s*//" | grep -v "^$" || true)

          if [ -n "$CONFIG_ACTIVE" ]; then
            echo "❌ Found localhost in active next.config.js code:"
            echo "$CONFIG_ACTIVE"
            FAILED=1
          else
            echo "✅ next.config.js files are clean"
          fi

          # ── Check 2: Client-side components (.tsx files) ──
          # These run in the browser. Exclude server-side files.
          echo ""
          echo "── Checking client components (.tsx) ──"
          CLIENT_MATCHES=$(grep -rn \
            --include="*.tsx" \
            --exclude-dir="node_modules" \
            --exclude-dir=".next" \
            -E "http://localhost:[0-9]+" \
            frontend/app/ frontend/components/ \
            chat_srvc/app/components/ chat_srvc/app/page.tsx \
            2>/dev/null || true)

          # Filter out comment lines
          CLIENT_ACTIVE=$(echo "$CLIENT_MATCHES" | grep -vE "^[^:]+:[0-9]+:\s*//" | grep -v "^$" || true)

          if [ -n "$CLIENT_ACTIVE" ]; then
            echo "❌ Found localhost in client components:"
            echo "$CLIENT_ACTIVE"
            FAILED=1
          else
            echo "✅ Client components are clean"
          fi

          # ── Check 3: Static JS served to browsers ──
          # game_srvc/public/ files are served directly to browsers
          echo ""
          echo "── Checking static JS (game_srvc/public/) ──"
          STATIC_MATCHES=$(grep -rn \
            --include="*.js" \
            --exclude-dir="node_modules" \
            -E "http://localhost:[0-9]+" \
            game_srvc/public/ \
            2>/dev/null || true)

          # Filter out comment lines AND JSDoc lines (@param etc.)
          STATIC_ACTIVE=$(echo "$STATIC_MATCHES" \
            | grep -vE "^[^:]+:[0-9]+:\s*//" \
            | grep -vE "^[^:]+:[0-9]+:\s*\*" \
            | grep -v "^$" || true)

          # From what remains, allow lines that are inside an if-else
          # fallback like: condition ? origin : 'http://localhost:...'
          # (these only execute in dev, not production)
          STATIC_DANGEROUS=$(echo "$STATIC_ACTIVE" \
            | grep -v "localhost.*!==.*localhost" \
            | grep -v "hostname !== 'localhost'" \
            | grep -v "^$" || true)

          if [ -n "$STATIC_DANGEROUS" ]; then
            echo "❌ Found localhost in static JS:"
            echo "$STATIC_DANGEROUS"
            FAILED=1
          else
            echo "✅ Static JS files are clean"
          fi

          # ── Check 4: Frontend login/register pages ──
          echo ""
          echo "── Checking frontend page files ──"
          PAGE_MATCHES=$(grep -rn \
            --include="*.tsx" \
            --include="*.ts" \
            --exclude-dir="node_modules" \
            --exclude-dir=".next" \
            --exclude="*route.ts" \
            -E "http://localhost:[0-9]+" \
            frontend/app/login/ frontend/app/register/ \
            2>/dev/null || true)

          PAGE_ACTIVE=$(echo "$PAGE_MATCHES" | grep -vE "^[^:]+:[0-9]+:\s*//" | grep -v "^$" || true)

          if [ -n "$PAGE_ACTIVE" ]; then
            echo "❌ Found localhost in login/register pages:"
            echo "$PAGE_ACTIVE"
            FAILED=1
          else
            echo "✅ Login/register pages are clean"
          fi

          echo ""
          echo "═══════════════════════════════════════════════════"
          if [ "$FAILED" -eq 0 ]; then
            echo "✅ All browser-facing code is free of hardcoded localhost"
          else
            echo ""
            echo "❌ FAILED: Hardcoded localhost found in browser-facing code."
            echo "   Fix: Use relative paths (/auth, /chat, /game) or env vars."
            echo ""
            echo "   NOTE: Server-side files (server.js, proxy.ts, route.ts)"
            echo "   are NOT checked — localhost fallbacks are fine there."
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════
  # Stage 5: Full-stack integration smoke test
  #          Boots all containers + Nginx, verifies routes work
  # ════════════════════════════════════════════════════════════════
  integration_test:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: [build, validate_manifests, localhost_guard]
    env:
      POSTGRES_PASSWORD: ci_test_password_123
      AUTH_SECRET: ci_test_auth_secret_0123456789abcdef0123456789abcdef
      INTERNAL_SERVICE_SECRET: ci_test_service_secret_0123456789abcdef0123456789ab
      PUBLIC_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Build all service images
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Start the full stack (services + Nginx)
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            up -d
          echo "Waiting for services to become healthy..."

      - name: Wait for databases to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if docker exec postgres_db pg_isready -U postgres > /dev/null 2>&1; then
              echo "  PostgreSQL ready after ${i}s"
              break
            fi
            sleep 1
          done

          echo "Waiting for MongoDB..."
          for i in $(seq 1 30); do
            if docker exec mongo_db mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; then
              echo "  MongoDB ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Wait for application services to start
        run: |
          echo "Waiting for services to be ready..."
          sleep 15

          echo "=== Container status ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml ps

          echo ""
          echo "=== Auth service logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs auth_srvc --tail=15

          echo ""
          echo "=== Frontend logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs frontend --tail=10

      - name: Smoke test — Auth CSRF endpoint
        run: |
          echo "Testing: GET /auth/api/auth/csrf (through Nginx)"
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/auth/api/auth/csrf)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "  HTTP $HTTP_CODE"
          echo "  Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FAILED: Auth CSRF endpoint returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          if ! echo "$BODY" | grep -q "csrfToken"; then
            echo "❌ FAILED: Response does not contain csrfToken"
            exit 1
          fi

          echo "✅ Auth CSRF endpoint works"

      - name: Smoke test — Frontend serves HTML
        run: |
          echo "Testing: GET / (frontend through Nginx)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)

          echo "  HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FAILED: Frontend returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          # Verify the served bundle does NOT contain localhost:3000
          BUNDLE=$(curl -s http://localhost:8080/)
          if echo "$BUNDLE" | grep -q "localhost:3000"; then
            echo "❌ FAILED: Frontend HTML contains hardcoded localhost:3000!"
            exit 1
          fi

          echo "✅ Frontend serves correctly"

      - name: Smoke test — Chat service reachable
        run: |
          echo "Testing: GET /chat (through Nginx)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/chat)

          echo "  HTTP $HTTP_CODE"

          # Chat may return 200 or 307 (redirect to login) — both are valid
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ FAILED: Chat service returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Chat service reachable"

      - name: Smoke test — Game service reachable
        run: |
          echo "Testing: GET /game (through Nginx)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/game)

          echo "  HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ FAILED: Game service returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Game service reachable"

      - name: Smoke test — Auth session endpoint
        run: |
          echo "Testing: GET /auth/api/auth/session"
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/auth/api/auth/session)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)

          echo "  HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FAILED: Auth session endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Auth session endpoint works"

      - name: Smoke test — Verify frontend JS bundle uses /auth (not localhost)
        run: |
          echo "Testing: Frontend JS bundles for hardcoded localhost"

          # Fetch the main page and extract JS chunk URLs
          HTML=$(curl -s http://localhost:8080/)
          JS_URLS=$(echo "$HTML" | grep -oE '/_next/static/[^"]+\.js' | head -10)

          FAILED=0
          for js_path in $JS_URLS; do
            CONTENT=$(curl -s "http://localhost:8080${js_path}" 2>/dev/null || true)
            if echo "$CONTENT" | grep -q "localhost:3000"; then
              echo "❌ Found localhost:3000 in bundle: $js_path"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ FAILED: Frontend JS bundles contain hardcoded localhost URLs."
            echo "   This means NEXT_PUBLIC_AUTH_SERVICE_URL was not correctly set at build time."
            exit 1
          fi

          echo "✅ No localhost URLs found in frontend bundles"

      - name: Smoke test — Cross-service auth verification
        run: |
          echo "Testing: Auth service can verify tokens (internal endpoint)"

          # Hit the verify endpoint — should return 401 (no token) not 502 (service down)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8080/auth/api/auth/verify)

          echo "  HTTP $HTTP_CODE"

          # 401 or 405 = service is up and responding (just no valid token)
          # 502/503 = service is down = FAIL
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "❌ FAILED: Auth verify endpoint returned HTTP $HTTP_CODE (service error)"
            exit 1
          fi

          echo "✅ Auth verify endpoint is responsive"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "════════════════════════════════════════"
          echo " FAILURE DIAGNOSTICS"
          echo "════════════════════════════════════════"
          echo ""
          echo "=== Container status ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml ps -a
          echo ""
          echo "=== Auth service logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs auth_srvc --tail=50
          echo ""
          echo "=== Frontend logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs frontend --tail=30
          echo ""
          echo "=== Chat service logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs chat_srvc --tail=30
          echo ""
          echo "=== Game service logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs game_srvc --tail=30
          echo ""
          echo "=== Nginx logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs nginx --tail=30

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            down -v --remove-orphans