name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build & Lint - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth_srvc, chat_srvc, frontend, game_srvc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses dorny/paths-filter to only run heavy NPM steps if the service has actually changed
      - name: Check for changes in ${{ matrix.service }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '${{ matrix.service }}/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node.js
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.service }}/package-lock.json'

      - name: Install dependencies
        if: steps.filter.outputs.src == 'true'
        working-directory: ./${{ matrix.service }}
        run: npm ci

      - name: Lint
        if: steps.filter.outputs.src == 'true'
        working-directory: ./${{ matrix.service }}
        run: npm run lint --if-present

      - name: Build
        if: steps.filter.outputs.src == 'true'
        working-directory: ./${{ matrix.service }}
        run: npm run build --if-present

      - name: Security Audit
        if: steps.filter.outputs.src == 'true'
        working-directory: ./${{ matrix.service }}
        run: npm audit --audit-level=high || true # Warn about high vulnerabilities without failing the initial build

      - name: Validate Prisma Schema
        if: steps.filter.outputs.src == 'true'
        working-directory: ./${{ matrix.service }}
        run: |
          if [ -d "prisma" ]; then
            npx prisma validate
          fi
