name: Docker Services Check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth_srvc, chat_srvc, frontend, game_srvc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: test/${{ matrix.service }}:latest

      - name: Test Container Startup
        run: |
          # Create a dedicated network for communication
          docker network create test-net

          # Start a Postgres container
          echo "Starting Postgres..."
          docker run -d --name db --network test-net \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=testdb \
            postgres:15-alpine

          # Wait for Postgres to be ready
          echo "Waiting for Postgres to be ready..."
          sleep 10
          
          # Start the service container with DATABASE_URL
          echo "Starting ${{ matrix.service }}..."
          docker run -d --name ${{ matrix.service }} --network test-net \
            -e DATABASE_URL="postgresql://testuser:testpass@db:5432/testdb?schema=public" \
            test/${{ matrix.service }}:latest

          # Wait for service to initialize (allow time for migrations)
          sleep 15

          # Check if the service container is still running
          if [ "$(docker inspect -f '{{.State.Running}}' ${{ matrix.service }})" != "true" ]; then
            echo "Container ${{ matrix.service }} failed to start or exited unexpectedly."
            docker logs ${{ matrix.service }}
            # Cleanup
            docker stop db || true
            docker rm db || true
            docker network rm test-net || true
            exit 1
          fi

          echo "Container ${{ matrix.service }} is running successfully."
          # Optional: Show recent logs to confirm successful start
          docker logs ${{ matrix.service }} | head -n 20
          
          # Cleanup
          docker stop ${{ matrix.service }}
          docker stop db
          docker network rm test-net
    
