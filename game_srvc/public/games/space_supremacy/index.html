 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space_Supremacy</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0b0e2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            /* Scale canvas CSS size to fill window while preserving 16:9 aspect ratio */
            width: min(100vw, calc(100vh * 1280 / 720));
            height: min(100vh, calc(100vw * 720 / 1280));
        }
    </style>
    <script>
        // Fetch the logged-in user via same-origin proxy (avoids CORS with auth_srvc).
        // Path must include Next.js basePath '/game' (see game_srvc/next.config.js).
        (async function () {
            try {
                // Fetch runtime config
                try {
                    const cfgRes = await fetch('/game/api/config');
                    if (cfgRes.ok) {
                        const cfg = await cfgRes.json();
                        window.REMOTE_MULTIPLAYER_ENABLED = cfg.remoteMultiplayerEnabled === true;
                        if (cfg && typeof cfg.socketPath === 'string' && cfg.socketPath) {
                            window.GAME_SOCKET_PATH = cfg.socketPath;
                        }
                        if (cfg && typeof cfg.gameRoomId === 'string' && cfg.gameRoomId) {
                            window.GAME_ROOM_ID = cfg.gameRoomId;
                        }
                    }
                } catch (_) {
                    window.REMOTE_MULTIPLAYER_ENABLED = false;
                }

                const res = await fetch('/game/api/auth/me', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.user && data.user.id) {
                        window.currentUser = {
                            id: data.user.id,
                            username: data.user.username,
                        };
                    }
                }
            } catch (_) { /* not logged in */ }
        })();
    </script>
</head>

<body>
	<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="../main_menu.js"></script>
    <script src="../gameMenu_stats.js"></script>
    <script src="../game_menu.js"></script>
    <script src="../local_dqn_bridge.js"></script>
    <script src="../game.js"></script>
	<script src="../gameOver_stats.js"></script>
</body>

</html>
