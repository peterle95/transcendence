# ============================================================================
# Docker Compose - Architecture Blueprint
# ============================================================================

name: transcendence

services:
  # ========================================
  # PostgreSQL Database
  # Used by: Auth Service (future), Game Service (future)
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    hostname: "postgres.transcendence-backend"
    environment:
      # Create multiple databases for different services
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize multiple databases on startup
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/postgres"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      vault_srvc:
        condition: service_healthy

  # ========================================
  # MongoDB Database
  # Used by: Chat Service (functional)
  # ========================================
  mongo:
    image: mongo:7-jammy
    container_name: mongo_db
    hostname: "mongo.transcendence-backend"
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/mongo"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      vault_srvc:
        condition: service_healthy

  # ========================================
  # Auth Service - ✅ FUNCTIONAL
  # Handles authentication, user management, and friendships
  # ========================================
  auth_srvc:
    build: ./auth_srvc
    container_name: auth_service
    hostname: "auth.transcendence-backend"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/auth_db
      - AUTH_SECRET=3f4b9c1c0c6a2f2a8e7d9c4b1a5e6f0c3b7d2a1f9e8c6b5d4a3f2c1e0b9a8d7
      - NEXTAUTH_URL=http://localhost:3000
      - CORS_ALLOWED_ORIGIN=http://localhost:3003,http://localhost:3001
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      vault_srvc:
        condition: service_healthy
    volumes:
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/auth_srvc"
    networks:
      - backend_net
    restart: unless-stopped

  # ========================================
  # Chat Service - ✅ FUNCTIONAL
  # The ONLY fully implemented service
  # ========================================
  chat_srvc:
    build: ./chat_srvc
    container_name: chat_service
    hostname: "chat.transcendence-backend"
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/chat-service
      - AUTH_SERVICE_URL=http://auth_srvc:3000
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:3000
      - NEXT_PUBLIC_GAME_SERVICE_URL=http://localhost:3002
      - SOCKET_IO_ALLOWLIST=http://localhost:3001,https://localhost:3001,http://localhost:3003,http://localhost:3002
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - NODE_ENV=development
    depends_on:
      mongo:
        condition: service_healthy
      auth_srvc:
        condition: service_started
      vault_srvc:
        condition: service_healthy
    volumes:
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/chat_srvc"
    networks:
      - backend_net
    restart: unless-stopped

  # Frontend
  #
  #
  frontend:
    build: ./frontend
    container_name: frontend_service
    hostname: "frontend.transcendence-backend"
    ports:
      - "3003:3003"
    environment:
      - AUTH_SERVICE_URL=http://auth_srvc:3000
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:3000
      - CHAT_SERVICE_URL=http://localhost:3001
      - NEXT_PUBLIC_CHAT_SERVICE_URL=http://localhost:3001
      - GAME_SERVICE_URL=http://localhost:3002
      - NEXT_PUBLIC_GAME_SERVICE_URL=http://localhost:3002
      - NODE_ENV=development
    depends_on:
      auth_srvc:
        condition: service_started
      chat_srvc:
        condition: service_started
      vault_srvc:
        condition: service_healthy
    volumes:
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/frontend"
    networks:
      - backend_net

  # Game Service - Serves games from public/games/
  game_srvc:
    build: ./game_srvc
    container_name: game_service
    hostname: "game.transcendence-backend"
    ports:
      - "3002:3002"
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/game_db
      - AUTH_SERVICE_URL=http://auth_srvc:3000
      - SERVICE_SECRET=inter-service-shared-secret-change-in-production
      - SOCKET_CORS_ORIGIN=http://localhost:3002
      - SOCKET_PORT=4000
      - SOCKET_IO_ALLOWLIST=http://localhost:3002,https://localhost:3002
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      auth_srvc:
        condition: service_started
      vault_srvc:
        condition: service_healthy
    volumes:
      - type: volume
        source: "vault_data"
        target: "/vault/pub"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/cacert"
      - type: volume
        source: "vault_data"
        target: "/vault/prv"
        read_only: true
        volume:
          nocopy: true
          subpath: "distribute/game_srvc"
    networks:
      - backend_net
    restart: unless-stopped

  # Vault Service - Secret management
  vault_srvc:
    build: "./vault_srvc"
    container_name: vault_service
    hostname: "vault.transcendence-backend"
    expose:
      - "8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://vault.transcendence-backend:8200/v1/sys/health"]
      start_period:   1m
      start_interval: 20s
      interval:       45s
      timeout:        1m
      retries:        3
    volumes:
      - "vault_data:/vault/"
    networks:
      - backend_net
    restart: no
    cap_add:
      - IPC_LOCK


volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  vault_data:
    driver: local

networks:
  backend_net:
    driver: bridge

# ============================================================================
# Quick Start
# ============================================================================
#
# Access Chat Service:
#   http://localhost:3001/api/chat/send
#   http://localhost:3001/api/chat/history
#
# Connect to databases:
#   PostgreSQL: postgresql://postgres:password@localhost:5433/
#   MongoDB: mongodb://localhost:27017/
#
# View logs:
#   docker-compose logs -f chat_srvc
#
# Stop services:
#   docker-compose down
# ============================================================================
