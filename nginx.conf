load_module "/usr/lib/nginx/modules/ngx_http_coraza_module.so";

worker_processes auto;

error_log /var/log/nginx/error.log debug;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	access_log /var/log/nginx/access.log;

	upstream frontend_upstream  { server 172.18.0.6:3003; }
	upstream auth_upstream      { server 172.18.0.8:3000; }
	upstream chat_upstream      { server 172.18.0.3:3001; }
	upstream game_upstream      { server 172.18.0.7:3002; }
	upstream game_ws_upstream   { server 172.18.0.7:4000; }

	server {
		listen 80;
		server_name transcendence.com;

		client_max_body_size 10M;

		# Frontend
		location / {
			coraza on;
			coraza_rules_file /opt/coraza/config/coraza-rules.conf;

			proxy_pass http://frontend_upstream;
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host  $host;
		}

		# Auth Service — proxy /auth/... to container keeping the /auth prefix
		# auth_srvc has basePath '/auth' so it expects full /auth/api/auth/... paths
		location /auth/ {
			coraza on;
			coraza_rules_file /opt/coraza/config/coraza-rules.conf;

			proxy_pass http://auth_upstream;
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host  $host;
			proxy_set_header Cookie            $http_cookie;
		}

		# Chat Service
		location /chat {
			coraza on;
			coraza_rules_file /opt/coraza/config/coraza-rules.conf;

			proxy_pass http://chat_upstream;
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host  $host;
			proxy_set_header Cookie            $http_cookie;
		}

		# Chat WebSocket
		location /chat/socket.io/ {
			proxy_pass http://chat_upstream/socket.io/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade           $http_upgrade;
			proxy_set_header Connection        "upgrade";
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host  $host;
			proxy_set_header Cookie            $http_cookie;
			proxy_read_timeout 86400s;
			proxy_send_timeout 86400s;
		}

		# Game Service
		location /game {
			coraza on;
			coraza_rules_file /opt/coraza/config/coraza-rules.conf;

			proxy_pass http://game_upstream;
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host  $host;
			proxy_set_header Cookie            $http_cookie;
		}

		# Game WebSocket (socket server on port 4000)
		location /game/socket.io/ {
			proxy_pass http://game_ws_upstream/socket.io/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade           $http_upgrade;
			proxy_set_header Connection        "upgrade";
			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host  $host;
			proxy_set_header Cookie            $http_cookie;
			proxy_read_timeout 86400s;
			proxy_send_timeout 86400s;
		}
	}
}
