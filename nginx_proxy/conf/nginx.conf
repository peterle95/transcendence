worker_processes auto;

events {
	worker_connections 1024;
}

http {
	http2		on;
	http3		on;
	resolver	127.0.0.11	ipv6=off;

	upstream frontend_upstream  { server frontend.${PROJECT_NAME}-${SERVICE_NAMESPACE}:${FRONTEND_PORT}; }
	upstream auth_upstream      { server auth.${PROJECT_NAME}-${SERVICE_NAMESPACE}:${AUTH_PORT}; }
	upstream chat_upstream      { server chat.${PROJECT_NAME}-${SERVICE_NAMESPACE}:${CHAT_PORT}; }
	upstream game_upstream      { server game.${PROJECT_NAME}-${SERVICE_NAMESPACE}:${GAME_PORT}; }
	upstream game_ws_upstream   { server game.${PROJECT_NAME}-${SERVICE_NAMESPACE}:${GAME_WS_PORT}; }

	server	{
		listen		${NGINX_TCP};

		server_name			${DOMAIN};

		return		301		${HTTP}@host@request_uri;
	}

	server {
		listen		${NGINX_TLS}	ssl;
		listen		${NGINX_UDP}	quic		reuseport;

		server_name			${DOMAIN};
		ssl_protocols			TLSv1.3;
		ssl_certificate    		${MAIN_CERT_PATH};
		ssl_certificate_key		${MAIN_KEY_PATH};
		ssl_client_certificate		${ROOTCERT};

		proxy_ssl_server_name		on;
		proxy_ssl_protocols		TLSv1.3;
		proxy_ssl_certificate    	${CERT_PATH};
		proxy_ssl_certificate_key	${KEY_PATH};
		proxy_ssl_trusted_certificate	${ROOTCERT};
		proxy_ssl_session_reuse		on;

		client_max_body_size		10M;

		$using_at_because_envsubst_will_remove_all_strings
		$that_start_with_a_dollarsign_and_arent_an_env_keyword
		$using_sed_after_envsubst_to_change_at_back_to_dollarsigns

		location /assets/ {
			rewrite ^/assets/(.*) ${GAME_PATH}/assets/@1 break;
			proxy_pass ${HTTP}game_upstream;
			proxy_set_header	Host			@host;
			proxy_set_header	X-Real-IP		@remote_addr;
			proxy_set_header	X-Forwarded-For		@proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	@scheme;
			proxy_set_header	X-Forwarded-Host	@host;
			${ADD_HEADER}		${ONION_LOCATION}	${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location = /api/auth/me {
			proxy_pass ${HTTP}game_upstream${GAME_PATH}/api/auth/me;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location = /api/stats/save {
			proxy_pass ${HTTP}game_upstream${GAME_PATH}/api/stats/save;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location = /api/stats/ranking {
			proxy_pass ${HTTP}game_upstream${GAME_PATH}/api/stats/ranking;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location = /api/auth/token {
			proxy_pass ${HTTP}game_upstream${GAME_PATH}/api/auth/token;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}


		location /api/friends {
			proxy_pass ${HTTP}chat_upstream${CHAT_PATH}/api/friends;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location /api/chat/history {
			proxy_pass ${HTTP}chat_upstream${CHAT_PATH}/api/chat/history;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location /api/chat/send {
			proxy_pass ${HTTP}chat_upstream${CHAT_PATH}/api/chat/send;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}
	
		location /api/game-invite {
			proxy_pass ${HTTP}chat_upstream${CHAT_PATH}/api/game-invite;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location /api/users {
			proxy_pass ${HTTP}chat_upstream${CHAT_PATH}/api/user;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location / {
			proxy_pass ${HTTP}frontend_upstream;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location ${AUTH_PATH} {
			proxy_pass ${HTTP}auth_upstream;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location ${CHAT_PATH} {
			proxy_pass ${HTTP}chat_upstream;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location ${CHAT_PATH}${CHAT_WS_PATH} {
			proxy_pass ${HTTP}chat_upstream${CHAT_WS_PATH};
			proxy_http_version 1.1;
			proxy_set_header Upgrade           @http_upgrade;
			proxy_set_header Connection        "upgrade";
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			proxy_read_timeout 86400s;
			proxy_send_timeout 86400s;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}

		location ${GAME_PATH} {
			proxy_pass ${HTTP}game_upstream;
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_VAULT_HEADER}${REQUEST_URI}
		}

		location ${GAME_PATH}${GAME_WS_PATH} {
			proxy_pass ${HTTP}game_ws_upstream/socket.io/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade           @http_upgrade;
			proxy_set_header Connection        "upgrade";
			proxy_set_header Host              @host;
			proxy_set_header X-Real-IP         @remote_addr;
			proxy_set_header X-Forwarded-For   @proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto @scheme;
			proxy_set_header X-Forwarded-Host  @host;
			proxy_set_header Cookie            @http_cookie;
			proxy_read_timeout 86400s;
			proxy_send_timeout 86400s;
			${ADD_HEADER} ${ONION_LOCATION} ${ONION_ADDRESS_MAIN_HEADER}${REQUEST_URI}
		}
	}

	server {
		listen			1337		ssl;
		listen			1337		quic		reuseport;

		server_name ${HOSTNAME};
		ssl_protocols			TLSv1.3;
		ssl_certificate    		${CERT_PATH};
		ssl_certificate_key		${KEY_PATH};
		ssl_client_certificate		${ROOTCERT};

		proxy_ssl_server_name		on;
		proxy_ssl_verify		on;
		proxy_ssl_protocols		TLSv1.3;
		proxy_ssl_certificate    	${CERT_PATH};
		proxy_ssl_certificate_key	${KEY_PATH};
		proxy_ssl_trusted_certificate	${ROOTCERT};
		proxy_ssl_session_reuse		on;

		location /healthcheck {
			access_log	off;
			return		200		'OK';
		}
	}
}
