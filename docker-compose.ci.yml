# ============================================================================
# Docker Compose – CI overlay
# Adds Nginx so the full routing stack is testable in GitHub Actions.
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d
# ============================================================================

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_ci
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/ci.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth_srvc
      - chat_srvc
      - game_srvc
    networks:
      - app_network
    restart: "no"
